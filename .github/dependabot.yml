version: 2
updates:
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all:
        patterns:
        - "*"

  - package-ecosystem: "uv"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "monthly"
    allow:
    # Include transitive dependencies (e.g. urllib3, certifi): the Docker image installs uv.lock as is.
    - dependency-type: "all"
    groups:
      all:
        patterns:
        - "*"
      # Without this, each vulnerable dependency gets its own security PR.
      security:
        applies-to: security-updates
        patterns:
        - "*"
    commit-message:
      prefix: "chore(deps):"

  # Weekly, as the wolfi-base digest carries the OS CVE fixes.
  - package-ecosystem: "docker"
    cooldown:
      default-days: 7
    directory: "/dockerfiles"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns:
        - "*"
        # Dockerfile.db is the local dev database: its Postgres bumps get their own PR.
        exclude-patterns:
        - "vincentsarago/postgis"
