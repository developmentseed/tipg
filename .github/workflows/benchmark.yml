name: Benchmark

on:
  push:
    branches:
    - main
    tags:
    - '*'
    paths:
      - 'pyproject.toml'
      - 'tipg/**'
      - 'tests/**'
      - '.github/workflows/benchmark.yml'
      - 'uv.lock'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  LATEST_PY_VERSION: '3.14'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.*" 
          enable-cache: false
          python-version: ${{ matrix.python-version }}

      # Install PostgreSQL and PostGIS together from PGDG so their versions always match.
      # pytest-postgresql finds `pg_ctl` through `pg_config` on PATH.
      - name: Install PostgreSQL and PostGIS
        env:
          PG_MAJOR: '16'
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt/ $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y "postgresql-${PG_MAJOR}" "postgresql-${PG_MAJOR}-postgis-3"
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          uv sync

      - name: Run Benchmark
        run: uv run pytest tests/benchmarks.py --benchmark-only --benchmark-columns 'min, max, mean, median' --benchmark-json output.json --asyncio-mode=strict

      - name: Store and benchmark result
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1
        with:
          name: TiPg Benchmarks
          tool: 'pytest'
          output-file-path: output.json
          alert-threshold: '130%'
          # PR tokens from Dependabot and forks are read-only: on PRs, report in the job summary instead of commenting
          comment-on-alert: ${{ github.event_name != 'pull_request' }}
          summary-always: ${{ github.event_name == 'pull_request' }}
          fail-on-alert: false
          # GitHub API token to make a commit comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: 'gh-benchmarks'
          # Make a commit only if main
          auto-push: ${{ github.ref == 'refs/heads/main' }}
